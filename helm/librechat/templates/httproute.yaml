apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: librechat
  namespace: librechat
spec:
  parentRefs:
    - name: external-gateway
      namespace: envoy-gateway
      sectionName: chat
  hostnames:
    - chat.internal.node.energy
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: librechat-librechat
          port: 3080
      # LLM answers are streamed and can run for minutes; Envoy's default of 15s would cut them off
      timeouts:
        request: 300s
