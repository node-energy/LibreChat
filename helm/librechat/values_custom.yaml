# Default values for librechat.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

global:
   # existing Secret for all envs/ only Passwords. Can be locally generated with: kubectl create secret generic librechat-secret-envs --from-env-file=.env.example --dry-run=client -o yaml > secret-envs.yaml
   # For better maintainabillity, you can put all vars directly in the config Section and only overwrite Secrets with this if nessesary.
   # Required Values:
   # - MEILI_MASTER_KEY
  librechat:
    existingSecretName: "librechat-credentials-env"
    existingSecretApiKey: AZURE_OPENAI_API_KEY

librechat:
  configEnv:
    DEBUG_PLUGINS: "false"
    DEBUG_LOGGING: "false"
    DEBUG_CONSOLE: "false"
    LOG_LEVEL: "info"

    ALLOW_REGISTRATION: "false"
    ALLOW_SOCIAL_LOGIN: "true"
    ALLOW_SOCIAL_REGISTRATION: "false"

    OPENID_CLIENT_ID: ea52d0d0-0369-4f74-8db6-3902fb9f6c4e
    OPENID_ISSUER: https://login.microsoftonline.com/791cc635-dca1-4d39-8639-295d41cb4d6e/v2.0/
    OPENID_SCOPE: openid profile email
    OPENID_CALLBACK_URL: /oauth/openid/callback
    OPENID_BUTTON_LABEL: Login mit Microsoft
    DOMAIN_CLIENT: https://chat.internal.node.energy
    DOMAIN_SERVER: https://chat.internal.node.energy

    GOOGLE_SERVICE_KEY_FILE: ""
    ANTHROPIC_USE_VERTEX: "false"
    ANTHROPIC_VERTEX_REGION: "europe-west1"

    AZURE_USE_MODEL_AS_DEPLOYMENT_NAME: "false"

    # IMPORTANT -- GENERATE your own: openssl rand -hex 32 and openssl rand -hex 16 for CREDS_IV. Best Practise: Put into Secret. See gloobal.librechat.existingSecretName

    # existing Secret for all envs/ only Passwords. Can be locally generated with: kubectl create secret generic librechat-secret-envs --from-env-file=.env.example --dry-run=client -o yaml > secret-envs.yaml
    # For better maintainabillity, you can put all vars directly in the config Section and only overwrite Secrets with this if nessesary.
    # Required Values:
    # - MEILI_MASTER_KEY
  existingSecretName: "librechat-credentials-env"

  # For adding a custom config yaml-file you can set the contents in this var. See https://www.librechat.ai/docs/configuration/librechat_yaml/example
  configYamlContent:
    version: 1.0.8

    cache: false
    interface:
      modelSelect: false
      parameters: false
      sidePanel: false
      presets: true
      prompts: true
      bookmarks: true
      multiConvo: false
      agents: false
      customWelcome: "Hey {{user.name}}! Willkommen bei LibreChat :)"
      runCode: false
      webSearch: true

    endpoints:
      custom:
#        - name: "openai-gpt-5"
#          baseURL: https://api.openai.com/v1
#          apiKey: ${NE_OPENAI_API_KEY}
#          models:
#            fetch: true
#            default:
#              - gpt-5
#
#        - name: "openai-gpt-5-mini"
#          baseURL: https://api.openai.com/v1
#          apiKey: ${NE_OPENAI_API_KEY}
#          models:
#            fetch: true
#            default:
#              - gpt-5-mini

        - name: "claude-opus-4-8"
          baseURL: "https://api.anthropic.com/v1/"
          apiKey: ${NE_ANTHROPIC_API_KEY}
          models:
            fetch: false
            default:
              - claude-opus-4-8

        - name: "claude-sonnet-4-6"
          baseURL: "https://api.anthropic.com/v1/"
          apiKey: ${NE_ANTHROPIC_API_KEY}
          models:
            fetch: false
            default:
              - claude-sonnet-4-6

        - name: "claude-haiku-4-5-20251001"
          baseURL: "https://api.anthropic.com/v1/"
          apiKey: ${NE_ANTHROPIC_API_KEY}
          models:
            fetch: false
            default:
              - claude-haiku-4-5-20251001

        - name: "gpt-4.1-deploy"
          apiKey: "${NE_AZURE_OPENAI_API_KEY}"
          baseURL: "https://nodeenergy.openai.azure.com/openai/deployments/gpt-4.1-deploy/chat/completions?api-version=2025-01-01-preview"
          models:
            default:
              - gpt-4.1-deploy
            fetch: false
          directEndpoint: true

        - name: "gpt-5.4-mini-deployment"
          apiKey: "${NE_AZURE_OPENAI_API_KEY}"
          baseURL: "https://nodeenergy.openai.azure.com/openai/deployments/gpt-5.4-mini-deployment/chat/completions?api-version=2024-12-01-preview"
          models:
            default:
              - gpt-5.4-mini-deployment
            fetch: false
          directEndpoint: true

        - name: "gpt-5.6-terra-deployment"
          apiKey: "${NE_AZURE_OPENAI_API_KEY}"
          baseURL: "https://nodeenergy.openai.azure.com/openai/deployments/gpt-5.6-terra-deployment/chat/completions?api-version=2024-12-01-preview"
          models:
            default:
              - gpt-5.6-terra-deployment
            fetch: false
          directEndpoint: true

        - name: "gpt-4.1-mini-deploy"
          apiKey: "${NE_AZURE_OPENAI_API_KEY}"
          baseURL: "https://nodeenergy.openai.azure.com/openai/deployments/gpt-4.1-mini-deployment/chat/completions?api-version=2025-01-01-preview"
          models:
            default:
              - gpt-4.1-mini-deploy
            fetch: false
          directEndpoint: true

        - name: "gpt-5-mini-deploy"
          apiKey: "${NE_AZURE_OPENAI_API_KEY}"
          baseURL: "https://nodeenergy.openai.azure.com/openai/deployments/gpt-5-mini-deploy/chat/completions?api-version=2025-01-01-preview"
          models:
            default:
              - gpt-5-mini-deploy
            fetch: false
          directEndpoint: true

        - name: "gpt-5-nano-deploy"
          apiKey: "${NE_AZURE_OPENAI_API_KEY}"
          baseURL: "https://nodeenergy.openai.azure.com/openai/deployments/gpt-5-nano-deploy/chat/completions?api-version=2025-01-01-preview"
          models:
            default:
              - gpt-5-nano-deploy
            fetch: false
          directEndpoint: true

        - name: "mistral"
          apiKey: "${MISTRAL_API_KEY}"
          baseURL: "https://api.mistral.ai/v1"
          models:
            default:
              - mistral-large-latest
            fetch: true
          titleConvo: true
          titleModel: "mistral-small"
          dropParams: [ "stop", "user", "frequency_penalty", "presence_penalty" ]

    modelSpecs:
      list:
        - name: "gpt-4.1"
          label: "gpt-4.1"
          description: "Azure (Europe)"
          default: true
          preset:
            endpoint: "gpt-4.1-deploy"
            model: "gpt-4.1-deploy"
            modelLabel: "Azure [gpt-4.1]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "gpt-5.6-terra"
          label: "gpt-5.6-terra"
          description: "Azure (Europe)"
          default: true
          preset:
            endpoint: "gpt-5.6-terra-deployment"
            model: "gpt-5.6-terra-deployment"
            modelLabel: "Azure [gpt-5.6-terra]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "gpt-5.4-mini"
          label: "gpt-5.4-mini"
          description: "Azure (Europe)"
          default: true
          preset:
            endpoint: "gpt-5.4-mini-deployment"
            model: "gpt-5.4-mini-deployment"
            modelLabel: "Azure [gpt-5.4-mini]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "gpt-4.1-mini"
          label: "gpt-4.1-mini"
          description: "Azure (Europe)"
          default: true
          preset:
            endpoint: "gpt-4.1-mini-deploy"
            model: "gpt-4.1-mini-deploy"
            modelLabel: "Azure [gpt-4.1-mini]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "gpt-5-mini-deploy"
          label: "gpt-5-mini"
          description: "Azure (Europe)"
          preset:
            endpoint: "gpt-5-mini-deploy"
            model: "gpt-5-mini-deploy"
            modelLabel: "Azure [gpt-5-mini]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "gpt-5-nano-deploy"
          label: "gpt-5-nano"
          description: "Azure (Europe)"
          preset:
            endpoint: "gpt-5-nano-deploy"
            model: "gpt-5-nano-deploy"
            modelLabel: "Azure [gpt-5-nano]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "mistral"
          label: "mistral"
          description: "mistral (Europe)"
          preset:
            endpoint: "mistral"
            model: "mistral-large-latest"
            modelLabel: "mistral-large"
            promptPrefix: |
              You are a helpful assistant.

        - name: "claude-opus-4-8"
          label: "claude-opus-4-8"
          description: "Anthropic"
          preset:
            endpoint: "claude-opus-4-8"
            model: "claude-opus-4-8"
            modelLabel: "Anthropic [claude-opus-4-8]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "claude-sonnet-4-6"
          label: "claude-sonnet-4-6"
          description: "Anthropic"
          preset:
            endpoint: "claude-sonnet-4-6"
            model: "claude-sonnet-4-6"
            modelLabel: "Anthropic [claude-sonnet-4-6]"
            promptPrefix: |
              You are a helpful assistant.

        - name: "claude-haiku-4-5-20251001"
          label: "claude-haiku-4-5"
          description: "Anthropic"
          default: true
          preset:
            endpoint: "claude-haiku-4-5-20251001"
            model: "claude-haiku-4-5-20251001"
            modelLabel: "Anthropic [claude-haiku-4-5]"
            promptPrefix: |
              You are a helpful assistant.

