name: Build & Push LibreChat Cleanup Image

on:
  push:
    branches: [release, test]
    paths:
      - 'k8s/librechat-purge/**'
      - '.github/workflows/deploy-librechat-purge.yaml'
  workflow_dispatch:

env:
  AZURE_CLIENT_ID: "199ddfee-1a06-4417-95be-3a5e76b3f374"
  AZURE_ACR: nodeenergy
  AZURE_ACR_URL: nodeenergy.azurecr.io
  AZURE_ACR_REPOSITORY: "librechat-purge"
  IMAGE_NAME: "librechat-purge"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login using Service Principal
        shell: bash
        run: |
          az login \
            --service-principal \
            --username=${{ env.AZURE_CLIENT_ID }} \
            --tenant=${{ secrets.AZURE_TENANT_ID }} \
            --password=${{ secrets.AZURE_CLIENT_PASSWORD }}

      - name: Docker Login to Azure Container Registry
        shell: bash
        run: az acr login --name=${{ env.AZURE_ACR }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: k8s/librechat-purge
          push: true
          tags: ${{ env.AZURE_ACR_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


  deploy:
      runs-on: ubuntu-latest
      needs: build-and-push

      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Azure login
          uses: azure/login@v2
          with:
            creds: ${{ secrets.AZURE_CREDENTIALS }}

        - name: AKS login
          uses: azure/use-kubelogin@v1.3
          with:
            kubelogin-version: 'v0.2.17'

        - name: Get K8s context
          uses: azure/aks-set-context@v5
          with:
            resource-group: "nodeenergy_internal"
            cluster-name: "nodeenergy_internal"
            admin: 'false'
            use-kubelogin: 'true'

        - name: Set Namespace
          id: set_namespace
          run: |
            if [[ "${{ github.ref_name }}" == "release" ]]; then
              echo "namespace=librechat"
              echo "namespace=librechat" >> $GITHUB_OUTPUT
            elif [[ "${{ github.ref_name }}" == "test" ]]; then
              echo "namespace=librechattest"
              echo "namespace=librechattest" >> $GITHUB_OUTPUT
            else
              echo "namespace=librechattest" >> $GITHUB_OUTPUT
            fi

        - name: Set up kubectl
          uses: azure/setup-kubectl@v5

        - name: Apply manifests
          run: |
            kubectl apply -f k8s/librechat-purge/ -n ${{ steps.set_namespace.outputs.namespace }}
            kubectl set image cronjob/librechat-purge purge=${{ env.AZURE_ACR_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -n ${{ steps.set_namespace.outputs.namespace }}
