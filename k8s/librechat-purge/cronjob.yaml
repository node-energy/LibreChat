apiVersion: batch/v1
kind: CronJob
metadata:
  name: librechat-purge
spec:
  schedule: "* * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # Pod stays Pending if no LibreChat pod is running to co-locate with
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          # The images PVC is ReadWriteOnce: run on the node that already mounts it
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: librechat-librechat
                  topologyKey: kubernetes.io/hostname
          volumes:
            - name: images
              persistentVolumeClaim:
                claimName: librechat-librechat-images
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: nodeenergy.azurecr.io/librechat-purge:8b3598d07
              args: ["--delete", "--yes", "--sweep-orphans"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: librechat-credentials-env
              env:
                - name: LIBRECHAT_URL
                  value: "http://librechat-librechat:3080"
                - name: STALE_DAYS
                  value: "180"
                - name: IMAGES_PATH
                  value: /images
              volumeMounts:
                - name: images
                  mountPath: /images
