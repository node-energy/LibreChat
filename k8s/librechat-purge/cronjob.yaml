apiVersion: batch/v1
kind: CronJob
metadata:
  name: librechat-purge
spec:
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: nodeenergy.azurecr.io/librechat-purge:latest
              args: ["--delete", "--yes"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              envFrom:
                - secretRef:
                    name: librechat-credentials-env
              env:
                - name: LIBRECHAT_URL
                  value: "http://librechat-librechat:3080"
                - name: STALE_DAYS
                  value: "180"
